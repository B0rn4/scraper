name: Scraper nekretnina

on:
  schedule:
    # Svakih 20 minuta. GitHub raspored je u UTC-u, pa je raspon širi;
    # skripta sama radi samo od 7 do 23 h po zagrebačkom vremenu.
    # Glavni okidač je cron-job.org (README.md); GitHubov raspored je samo rezerva
    # jer često kasni ili izostane. Tjedni izvještaj pokreće samo cron-job.org
    # (ponedjeljkom u 7:15), da ne stigne dvaput.
    - cron: "8,28,48 5-22 * * *"
  workflow_dispatch:
    inputs:
      naredba:
        description: "run = redovno odmah, raspored = redovno ali samo 7–23 h (za vanjski servis), pregled = pregledni izvještaj, test = probna poruka i mail, tjedni = tjedni izvještaj"
        type: choice
        options: [run, raspored, pregled, test, tjedni]
        default: run
      izvori:
        description: "Samo ovi izvori (npr. nekretnine_hr,fina); prazno = svi"
        type: string
        default: ""
      bez_slanja:
        description: "Ne šalji ništa na Telegram ni mail"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instaliraj ovisnosti
        run: pip install -r requirements.txt

      - name: Učitaj stanje
        run: |
          if git fetch -q --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:state.db > state.db
            echo "Stanje učitano ($(stat -c %s state.db) B)"
          else
            echo "Nema spremljenog stanja – prvo pokretanje."
          fi
          # Stanje s Redmija (Njuškalo): za nadzor Redmija i tjedni izvještaj.
          if git fetch -q --depth=1 origin state-redmi 2>/dev/null; then
            git show FETCH_HEAD:redmi.db > redmi.db
            echo "Stanje s Redmija učitano ($(stat -c %s redmi.db) B)"
          fi

      - name: Pokreni
        run: |
          CMD="${{ github.event.inputs.naredba }}"
          if [ -z "$CMD" ]; then CMD=run; fi
          ARGS=""
          if [ -n "${{ github.event.inputs.izvori }}" ]; then ARGS="$ARGS --izvori ${{ github.event.inputs.izvori }}"; fi
          if [ "${{ github.event.inputs.bez_slanja }}" = "true" ]; then ARGS="$ARGS --bez-slanja"; fi
          # "raspored" dolazi s vanjskog servisa (cron-job.org): redovno pokretanje
          # koje poštuje radno vrijeme. Ručni "run" radi odmah, i izvan radnog vremena.
          if [ "$CMD" = "raspored" ]; then CMD=run
          elif [ "$CMD" = "run" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --force"; fi
          python -m scraper $CMD $ARGS --redmi-db redmi.db

      - name: Spremi stanje
        if: always()
        run: |
          [ -f state.db ] || exit 0
          rm -rf /tmp/state && mkdir -p /tmp/state && cp state.db /tmp/state/
          # Sažetak već viđenih oglasa – Redmi ga preuzima da ne javi isti oglas s Njuškala.
          [ -f seen.json.gz ] && cp seen.json.gz /tmp/state/
          [ -f cijene.json ] && cp cijene.json /tmp/state/
          cd /tmp/state
          git init -q && git checkout -q -b state && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Stanje $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state

      - name: Spremi izvještaje kao artefakt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: izvjestaji
          path: out/
          if-no-files-found: ignore
          retention-days: 14
