# Ručno održavani podaci o lokacijama. Popis naselja je u locations.yaml (generiran).

# Gradovi i općine s kojih se šalju obavijesti.
ukljuceno:
  - Baška
  - Dobrinj
  - Kostrena
  - Lovran
  - Malinska-Dubašnica
  - Matulji          # samo mjesto Matulji (vidi samo_naselja)
  - Omišalj
  - Punat
  - Vrbnik
  - Crikvenica
  - Kraljevica
  - Krk
  - Opatija
  - Rijeka

# Dodatni nazivi (kvartovi, stari nazivi, nazivi katastarskih općina) koji se
# prepoznaju bilo gdje u tekstu.
dodatno:
  Rijeka: [Podvežica, Vežica, Sušak Nova, Trsat Sušak, Rijeka Grad]
  Kostrena: [Kostrena Lucija, Kostrena Barbara]
  Omišalj: [Omišalj Njivice]
  Malinska-Dubašnica: [Dubašnica, Miholjice, Sveti Vid Miholjice]
  Krk: [Krk Grad]
  Crikvenica: [Selce Nova]
  Matulji: [Brgud]
  Rab: [Barbat, Rab Mundanije]
  Vinodolska općina: [Belgrad, Grižane]
  Mali Lošinj: [Mali Lošinj Grad, Lošinj]
  Vrbovsko: [Gomirsko Vrbovsko]
  Čavle: [Cernik Čavle]

# Drugi nazivi za grad/općinu (strukturirana polja portala i tekst).
sinonimi:
  Malinska: Malinska-Dubašnica
  Grad Krk: Krk
  Otok Krk: Krk
  Opatija Okolica: Opatija
  Vinodolska: Vinodolska općina
  Općina Vinodolska: Vinodolska općina

# Katastarske općine koje nisu ujedno naselje ili kvart. Prepoznaju se samo
# iza oznake "k.o." (npr. "k.o. Novi" je Novi Vinodolski, a "novi" je i obična riječ).
katastarske_opcine:
  Novi: Novi Vinodolski
  Rupa: Matulji
  Brgud: Matulji

