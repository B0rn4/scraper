name: Faza 0 – test izvedivosti

on:
  push:
    paths:
      - "probe/probe.py"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj ovisnosti
        run: pip install requests curl_cffi

      - name: Pokreni test
        run: python probe/probe.py

      - name: Spremi rezultate u repozitorij
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/results
          git commit -m "Faza 0: rezultati testa izvedivosti" || exit 0
          git push
