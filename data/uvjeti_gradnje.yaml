# Uvjeti gradnje samostojeće obiteljske kuće u građevinskom području naselja, prepisani iz
# prostornih planova (scraper/plans.py). Za svako naselje vrijedi UPU ako postoji (popis
# "naselja"), inače PPU grada/općine (bez popisa naselja).
#
# Polja pravila: cestica = najmanja površina građevne čestice (m²), iznimno = manja dopuštena
# iznimno (postojeće čestice, interpolacija), kig / kis = najveći koeficijent izgrađenosti /
# iskoristivosti (kis nadzemno kad ga plan razlikuje), tlocrt / gbp = najveća tlocrtna i
# građevinska bruto površina (m²), od / do = pravilo vrijedi za česticu od … do … m², zona =
# oznaka zone u planu (kad se zona ne zna, poruka daje raspon svih zona).
#
# Godina uz naziv plana je godina teksta iz kojeg je prepisano – plan se u međuvremenu
# mogao mijenjati. Prepisano 7. 10. 2026. (dokumenti preuzeti tools/planovi.py).

