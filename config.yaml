# Postavke scrapera. Ove vrijednosti možeš mijenjati bez diranja koda.

vrijeme:
  zona: Europe/Zagreb
  od_sata: 7        # prvo pokretanje u danu
  do_sata: 23       # nakon ovog sata scraper ne radi

kriteriji:
  kuca:
    max_cijena: 400000     # €
    min_povrsina: 70       # m² stambene površine
    okucnica_za_parking_m2: 100   # bez navedenog parkinga: okućnica od ovoliko m² je dovoljna
  zemljiste:
    max_cijena: 300000     # €
    min_povrsina: 300      # m²
  # Oglasi koji promaše kriterij za najviše ovoliko posto idu u tjedni
  # izvještaj kao "za dlaku promašeni".
  za_dlaku_posto: 15

# Područje je definirano u data/locations.yaml (polje "ukljuceno").

izvori:
  nekretnine_hr: true
  index_oglasi: true
  oglasnik: true
  fina: true
  vender: true
  njuskalo: redmi   # čita Redmi s kućne IP adrese (REDMI.md); GitHub ga ne dira

obavijesti:
  telegram: true
  email: true
  # Ako u jednom pokretanju stigne više novih oglasa od ovoga, umjesto
  # pojedinačnih poruka šalje se jedan zbirni izvještaj (zaštita od poplave poruka).
  max_poruka_po_pokretanju: 30

nadzor:
  greske_prije_upozorenja: 3
  # Mail ako se Redmi (Njuškalo) ne javi ovoliko minuta (provjera s GitHuba, od 8 h).
  redmi_kasni_minuta: 90

# Natječaji za prodaju nekretnina (gradovi, općine, PGŽ, CERP…), popis stranica u
# data/natjecaji.yaml. Čita se jednom dnevno (prvo pokretanje od 7 h).
natjecaji:
  ukljuceno: true
  dana_unazad_prvi_put: 45   # prvi put: objave bez poznatog roka iz zadnjih 45 dana
  najstarije_s_rokom: 180    # prvi put: objave s rokom koji nije istekao, do 180 dana stare
  max_poruka: 15
