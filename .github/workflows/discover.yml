name: Razvoj – otkrivanje izvora podataka

on:
  push:
    paths:
      - "tools/discover.py"
      - "tools/discover2.py"
      - "tools/discover3.py"
      - "tools/discover4.py"
      - "tools/discover5.py"
      - "tools/discover7.py"
      - "tools/discover8.py"
      - "tools/discover9.py"
      - "tools/discover10.py"
      - "tools/discover11.py"
      - "tools/discover12.py"
      - "tools/discover13.py"
      - "tools/discover14.py"
      - "tools/discover15.py"
      - "tools/discover16.py"
      - "tools/discover17.py"
      - "tools/discover18.py"
      - "tools/discover19.py"
      - "tools/discover20.py"
      - "tools/discover21.py"
      - "tools/discover22.py"
      - "tools/discover23.py"
      - "tools/discover24.py"
      - "tools/discover25.py"
      - "tools/discover26.py"
      - "tools/discover27.py"
      - "tools/discover28.py"
      - ".github/workflows/discover.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-branch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj ovisnosti
        run: |
          pip install -r requirements.txt playwright pyproj
          python -m playwright install --with-deps chromium

      - name: Otkrij izvore
        timeout-minutes: 45
        run: |
          python tools/discover28.py debug-out

      - name: Spremi na granu debug
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd debug-out
          git init -q
          git checkout -q -b debug
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Otkrivanje izvora podataka"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug
