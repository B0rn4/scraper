name: Testovi

on:
  push:
    paths:
      - "scraper/**"
      - "tests/**"
      - "data/**"
      - "config.yaml"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  testovi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
