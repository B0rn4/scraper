name: Scraper nekretnina

on:
  schedule:
    # Svakih 20 minuta. GitHub raspored je u UTC-u, pa je raspon širi;
    # skripta sama radi samo od 7 do 23 h po zagrebačkom vremenu.
    # Glavni okidač je cron-job.org (README.md); GitHubov raspored je samo rezerva
    # jer često kasni ili izostane. Tjedni izvještaj pokreće samo cron-job.org
    # (ponedjeljkom u 7:15), da ne stigne dvaput.
    - cron: "8,28,48 5-22 * * *"
  workflow_dispatch:
    inputs:
      naredba:
        description: "run = redovno odmah, raspored = redovno ali samo 7–23 h (za vanjski servis), pregled = pregledni izvještaj, test = probna poruka i mail, tjedni = tjedni izvještaj"
        type: choice
        options: [run, raspored, pregled, test, tjedni]
        default: run
      izvori:
        description: "Samo ovi izvori (npr. nekretnine_hr,fina); prazno = svi"
        type: string
        default: ""
      bez_slanja:
        description: "Ne šalji ništa na Telegram ni mail"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instaliraj ovisnosti
        run: pip install -r requirements.txt

      - name: Učitaj stanje
        run: |
          # Grana koja ne postoji (izlaz 2) = prvo pokretanje. Svaka druga greška prekida posao:
          # inače bi se pokretanje s praznim stanjem spremilo preko pravog stanja.
          branch_exists() {
            rc=0; git ls-remote --exit-code --heads origin "$1" > /dev/null || rc=$?
            [ $rc -eq 0 ] && return 0
            [ $rc -eq 2 ] && return 1
            echo "Grana $1 nije provjerena (greška $rc) – prekid bez spremanja stanja"; exit 1
          }
          if branch_exists state; then
            git fetch -q --depth=1 origin state
            git show FETCH_HEAD:state.db > state.db
            echo "Stanje učitano ($(stat -c %s state.db) B)"
            # Datoteke za Redmi ostaju i kad ih ovo pokretanje ne napravi ponovno (tjedni
            # izvještaj, izvan radnog vremena, greška): redovno pokretanje ih prepiše.
            for f in seen.json.gz cijene.json github.json; do
              git show "FETCH_HEAD:$f" > "$f" 2>/dev/null || rm -f "$f"
            done
          else
            echo "Nema spremljenog stanja – prvo pokretanje."
          fi
          # Stanje s Redmija (Njuškalo): za nadzor Redmija, već viđene oglase i tjedni izvještaj.
          if branch_exists state-redmi; then
            git fetch -q --depth=1 origin state-redmi
            # Redmi šalje sažeto (redmi.db.gz); stariji kod slao je redmi.db.
            if git show FETCH_HEAD:redmi.db.gz > redmi.db.gz 2>/dev/null; then
              gunzip -c redmi.db.gz > redmi.db || echo "redmi.db.gz nije raspakiran (oštećen)"
              rm -f redmi.db.gz
            else
              rm -f redmi.db.gz
              git show FETCH_HEAD:redmi.db > redmi.db
            fi
            echo "Stanje s Redmija učitano ($(stat -c %s redmi.db) B)"
          fi
          touch .stanje-ucitano

      - name: Pokreni
        run: |
          CMD="${{ github.event.inputs.naredba }}"
          if [ -z "$CMD" ]; then CMD=run; fi
          ARGS=""
          if [ -n "${{ github.event.inputs.izvori }}" ]; then ARGS="$ARGS --izvori ${{ github.event.inputs.izvori }}"; fi
          if [ "${{ github.event.inputs.bez_slanja }}" = "true" ]; then ARGS="$ARGS --bez-slanja"; fi
          # "raspored" dolazi s vanjskog servisa (cron-job.org): redovno pokretanje
          # koje poštuje radno vrijeme. Ručni "run" radi odmah, i izvan radnog vremena.
          if [ "$CMD" = "raspored" ]; then CMD=run
          elif [ "$CMD" = "run" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --force"; fi
          # GitHubov raspored je samo rezerva: radi tek kad cron-job.org kasni (inače bi se
          # mogao poklopiti s Redmijem u :10/:30/:50).
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --rezerva"; fi
          python -m scraper $CMD $ARGS --redmi-db redmi.db

      - name: Spremi stanje
        if: always()
        run: bash tools/spremi_stanje.sh

      - name: Dnevna kopija stanja (zadnjih 7 dana)
        if: success()
        run: |
          [ -f state.db ] || exit 0
          DAY=$(TZ=Europe/Zagreb date +%F)
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/kopija && mkdir -p /tmp/kopija && cd /tmp/kopija && git init -q
          # Kao kod učitavanja stanja: samo grana koja ne postoji je nova; greška ne briše stare kopije.
          rc=0; git ls-remote --exit-code --heads "$REPO" state-kopija > /dev/null || rc=$?
          if [ $rc -eq 2 ]; then echo "Grana state-kopija ne postoji – prva kopija."
          elif [ $rc -ne 0 ]; then echo "Grana state-kopija nije provjerena (greška $rc) – kopija se preskače"; exit 0
          else
            # Bez starih kopija se ne sprema (inače bi push obrisao sedmodnevnu povijest).
            git fetch -q --depth=1 "$REPO" state-kopija || { echo "Kopije nisu preuzete – kopija se preskače"; exit 0; }
            git checkout -q FETCH_HEAD -- . || { echo "Kopije nisu raspakirane – kopija se preskače"; exit 0; }
          fi
          if [ -f "state-$DAY.db.gz" ]; then echo "Kopija za $DAY već postoji."; exit 0; fi
          gzip -c "$GITHUB_WORKSPACE/state.db" > "state-$DAY.db.gz"
          if [ -f "$GITHUB_WORKSPACE/redmi.db" ]; then gzip -c "$GITHUB_WORKSPACE/redmi.db" > "redmi-$DAY.db.gz"; fi
          for prefix in state redmi; do ls -1 $prefix-*.db.gz 2>/dev/null | sort -r | tail -n +8 | xargs -r git rm -q --cached --ignore-unmatch; done
          for prefix in state redmi; do ls -1 $prefix-*.db.gz 2>/dev/null | sort -r | tail -n +8 | xargs -r rm -f; done
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Kopija stanja $DAY"
          git push -qf "$REPO" HEAD:state-kopija
          echo "Kopija za $DAY spremljena: $(ls -1 | tr '\n' ' ')"

      - name: Spremi izvještaje kao artefakt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: izvjestaji
          path: out/
          if-no-files-found: ignore
          retention-days: 14
